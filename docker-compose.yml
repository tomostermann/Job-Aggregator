services:
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - app-network

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=jobaggregator-db
      - DB_PORT=5432
      - DB_USER=jobuser
      - DB_PASSWORD=secret
      - DB_NAME=jobdb
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: jobaggregator-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8282:8080"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
